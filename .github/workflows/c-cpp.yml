
name: Build PUBG2019PS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        run: |
          msbuild PUBG2019PS.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PUBG2019PS-Release
          path: |
            **/Release/*.dll
            **/Release/*.exe
            **/x64/Release/*.dll
            **/x64/Release/*.exe
          if-no-files-found: warn
